name: Build and Deploy ASP.Net Core API + Blazor WASM to Azure Web App - api-usmbtech

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Installer .NET
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # 3️⃣ Clean
      - name: Clean solution
        run: dotnet clean USMB_TECH/USMB_TECH.csproj

      # 4️⃣ Restore
      - name: Restore dependencies
        run: dotnet restore USMB_TECH/USMB_TECH.csproj

      # 5️⃣ Build
      - name: Build solution
        run: dotnet build USMB_TECH/USMB_TECH.csproj --configuration Release --no-restore

      # 6️⃣ Publish
      - name: Publish API + Blazor
        run: dotnet publish USMB_TECH/USMB_TECH.csproj --configuration Release --output publish

      # 7️⃣ Vérifier que icudt_EFIGS.dat existe
      - name: Verify icudt_EFIGS.dat exists
        run: |
          if [ ! -f "./publish/wwwroot/_framework/icudt_EFIGS.dat" ]; then
            echo "ERROR: icudt_EFIGS.dat is missing!"
            exit 1
          fi

      # 8️⃣ Upload artifact
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: full-app
          path: publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # 1️⃣ Télécharger artifact
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: full-app
          path: publish

      # 2️⃣ Login Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9FD37313CE8C4F389B9976F30123971B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CF49F06B2F244A3DAA092FFFDDF4DF78 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5081036E4D9E46B2ADAF49DD7A106AC6 }}

      # 3️⃣ Déploiement clean
      - name: Deploy to Azure Web App (clean)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-usmbtech'
          slot-name: 'Production'
          package: './publish'
          clean: true
