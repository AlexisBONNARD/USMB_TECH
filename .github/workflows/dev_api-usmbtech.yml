name: Build and Deploy ASP.Net Core API + Blazor WASM to Azure Web App - api-usmbtech

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      # 1️⃣ Récupération du code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Installation de .NET 8
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # 3️⃣ Nettoyage complet pour éviter les anciens fichiers
      - name: Clean solution
        run: dotnet clean USMB_TECH/USMB_TECH.csproj

      # 4️⃣ Restauration des dépendances
      - name: Restore dependencies
        run: dotnet restore USMB_TECH/USMB_TECH.csproj

      # 5️⃣ Compilation en Release
      - name: Build solution
        run: dotnet build USMB_TECH/USMB_TECH.csproj --configuration Release --no-restore

      # 6️⃣ Publication API + Blazor dans ./publish
      - name: Publish API and Blazor
        run: dotnet publish USMB_TECH/USMB_TECH.csproj --configuration Release --output publish

      # 7️⃣ Vérification que les fichiers _framework existent
      - name: List published files
        run: dir publish\wwwroot\_framework

      # 8️⃣ Upload de l'artifact pour déploiement
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: full-app
          path: publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      # 1️⃣ Télécharger l'artifact du build
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: full-app
          path: publish

      # 2️⃣ Connexion à Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9FD37313CE8C4F389B9976F30123971B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CF49F06B2F244A3DAA092FFFDDF4DF78 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5081036E4D9E46B2ADAF49DD7A106AC6 }}

      # 3️⃣ Déploiement clean vers Azure Web App
      - name: Deploy to Azure Web App (clean deploy)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-usmbtech'
          slot-name: 'Production'
          package: './publish'
          clean: true
